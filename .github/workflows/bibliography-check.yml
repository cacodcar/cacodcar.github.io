name: Check bibliography
on:
  pull_request:
    paths:
      - 'bibliography/**'
      - 'scripts/bibliography.py'
      - 'tests/test_bibliography.py'
      - '.github/workflows/bibliography-check.yml'
  push:
    branches: [master]
    paths:
      - 'bibliography/**'
      - 'scripts/bibliography.py'
      - 'tests/test_bibliography.py'
      - '.github/workflows/bibliography-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bibliography/requirements.txt
      - run: python -m pip install -r bibliography/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/bibliography.py check
      - run: python scripts/bibliography.py build
      - name: Check generated output is current
        run: git diff --exit-code -- bibliography/publications.bib bibliography/preview.html
      - uses: actions/upload-artifact@v4
        with:
          name: bibliography-preview
          path: |
            bibliography/preview.html
            bibliography/publications.bib
          if-no-files-found: error
